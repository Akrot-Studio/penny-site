# Penny's website on Cloudflare Pages (https://penny.akrot.app). Build with `node tools/build-site.js`, then:
#   npx wrangler pages deploy --branch main
# functions/ holds the newsletter sign-up (/api/subscribe) and /unsubscribe; sign-ups live in the D1 database below.
name = "penny"
pages_build_output_dir = "dist/site"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "NEWSLETTER"
database_name = "penny-newsletter"
database_id = "8f5b42c9-5538-4575-aaa4-0a50705dbf1d"
