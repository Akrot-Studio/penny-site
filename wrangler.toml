# Penny's website on Cloudflare Pages (https://penny.akrot.app). Cloudflare builds it with `node tools/build-site.js`
# into dist/site. functions/ holds the newsletter sign-up (/api/subscribe), /unsubscribe and the app's Pro code
# redemption (/api/redeem); sign-ups and promo codes live in the D1 database below. Secrets (LICENSE_KEY, LS_STORE_ID,
# LS_PRODUCT_ID) are set on the Cloudflare project, never here. `name` must match the Cloudflare Pages project.
name = "penny-site"
pages_build_output_dir = "dist/site"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "NEWSLETTER"
database_name = "penny-newsletter"
database_id = "8f5b42c9-5538-4575-aaa4-0a50705dbf1d"
